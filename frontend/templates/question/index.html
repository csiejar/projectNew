<script>
document.addEventListener("DOMContentLoaded", function () {
  const canvas = document.getElementById("drawingCanvas");
  const ctx = canvas.getContext("2d");

  const resetBtn = document.getElementById("resetCanvasBtn");
  const eraserBtn = document.getElementById("eraserBtn");
  const toolSizeSlider = document.getElementById("toolSize");

  let drawing = false;
  let erasing = false;
  let currentSize = parseInt(toolSizeSlider.value);

  // 初始化背景
  ctx.fillStyle = "#e0e0e0";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // SVG Cursor
  function generateCursorSVG(type, size) {
    if(type === "pencil") {
      return `data:image/svg+xml;base64,${btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" fill="black" viewBox="0 0 16 16"><path d="M12.146.854a.5.5 0 0 1 .708 0l2.292 2.292a.5.5 0 0 1 0 .708l-10 10a.5.5 0 0 1-.168.11l-5 2a.5.5 0 0 1-.65-.65l2-5a.5.5 0 0 1 .11-.168l10-10zM11.207 2L3 10.207V13h2.793L14 4.793 11.207 2zM12 3.207L13.793 5 12 6.793 10.207 5 12 3.207z"/></svg>`)}`;
    } else {
      return `data:image/svg+xml;base64,${btoa(`<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><rect x="0" y="0" width="${size}" height="${size}" fill="gray" rx="${size/5}"/></svg>`)}`;
    }
  }

  function updateCursor() {
    const cursorType = erasing ? "eraser" : "pencil";
    canvas.style.cursor = `url(${generateCursorSVG(cursorType, currentSize)}) ${Math.floor(currentSize/2)} ${Math.floor(currentSize/2)}, auto`;
  }

  updateCursor();

  // 橡皮擦切換
  eraserBtn.addEventListener("click", function () {
    erasing = !erasing;
    eraserBtn.classList.toggle("active");
    eraserBtn.classList.toggle("btn-dark");
    eraserBtn.classList.toggle("btn-outline-dark");
    updateCursor();
  });

  // 統一滑桿改變大小
 toolSizeSlider.addEventListener("input", function () {
  // 最小顯示大小 10px，最大就是滑桿值
  currentSize = Math.max(parseInt(this.value), 10);
  updateCursor();
});


  // 重設畫布
  resetBtn.addEventListener("click", function () {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = "#e0e0e0";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  });

  // 繪圖事件
  function startDraw(e) {
    drawing = true;
    ctx.beginPath();
    ctx.moveTo(e.offsetX, e.offsetY);
  }
  function draw(e) {
    if (!drawing) return;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = currentSize;
    ctx.strokeStyle = erasing ? "#e0e0e0" : "#000";
    ctx.lineTo(e.offsetX, e.offsetY);
    ctx.stroke();
  }
  function stopDraw() {
    drawing = false;
    ctx.beginPath();
  }

  canvas.addEventListener("mousedown", startDraw);
  canvas.addEventListener("mousemove", draw);
  canvas.addEventListener("mouseup", stopDraw);
  canvas.addEventListener("mouseout", stopDraw);

  // 觸控事件
  function startDrawTouch(e) {
    e.preventDefault();
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    ctx.beginPath();
    ctx.moveTo(touch.clientX - rect.left, touch.clientY - rect.top);
    drawing = true;
  }
  function drawTouch(e) {
    e.preventDefault();
    if (!drawing) return;
    const touch = e.touches[0];
    const rect = canvas.getBoundingClientRect();
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.lineWidth = currentSize;
    ctx.strokeStyle = erasing ? "#e0e0e0" : "#000";
    ctx.lineTo(touch.clientX - rect.left, touch.clientY - rect.top);
    ctx.stroke();
  }
  canvas.addEventListener("touchstart", startDrawTouch, { passive: false });
  canvas.addEventListener("touchmove", drawTouch, { passive: false });
  canvas.addEventListener("touchend", stopDraw);
});
</script>

      data-callback="handleCredentialResponse" data-auto_select="true">
    </div>

    <button class="button logout-only" id="logoutFromCard">登出帳戶</button>

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const userBtn = document.getElementById("userBtn");
    const userInfoOverlay = document.getElementById("userInfoOverlay");
    const closeUserCard = document.getElementById("closeUserCard");

    userBtn.addEventListener("click", function () {
      fetch('/api/authUser', { method: 'GET', credentials: 'include' })
        .then(res => res.json())
        .then(data => {
          if (data.message === "已登入") {
            document.getElementById("userAvatar").src = data.userData.userImg || "../static/img/default-avatar.png";
            document.getElementById("userName").textContent = data.userData.name;
            document.getElementById("userEmail").textContent = data.userData.email;
            document.getElementById("g_id_onload").style.display = "none";
            document.getElementById("loginBtn").style.display = "none";
            userInfoOverlay.style.display = "flex";
          }
          else {
            document.getElementById("userAvatar").src = "../static/img/default-avatar.png";
            document.getElementById("userName").textContent = "您尚未登入";
            document.getElementById("userEmail").textContent = "登入後即顯示";
            document.getElementById("logoutFromCard").style.display = "none";
            userInfoOverlay.style.display = "flex";
          }
        })
        .catch(err => console.error("取得使用者資訊失敗:", err));
    });

    // 關閉卡片按鈕
    closeUserCard.addEventListener("click", function () {
      userInfoOverlay.classList.add('fade-out');
      setTimeout(() => {
        userInfoOverlay.style.display = 'none';
        userInfoOverlay.classList.remove('fade-out');
      }, 300);
    });

    // 點擊遮罩關閉
    userInfoOverlay.addEventListener("click", function (event) {
      if (event.target === userInfoOverlay) {
        userInfoOverlay.classList.add('fade-out');
        setTimeout(() => {
          userInfoOverlay.style.display = 'none';
          userInfoOverlay.classList.remove('fade-out');
        }, 300);
      }
    });

    // 登出按鈕
    document.getElementById("logoutFromCard").addEventListener("click", logout);

    // ESC 鍵關閉彈窗
    document.addEventListener('keydown', function (event) {
      if (event.key === 'Escape' && userInfoOverlay.style.display === 'flex') {
        userInfoOverlay.classList.add('fade-out');
        setTimeout(() => {
          userInfoOverlay.style.display = 'none';
          userInfoOverlay.classList.remove('fade-out');
        }, 300);
      }
    });

    const urlParams = new URLSearchParams(window.location.search);
    const refreshed = urlParams.get('refreshed');

    if (refreshed === 'true') {
      checkAuthStatus();
    } else {
      checkAuthStatus();
    }

    function checkAuthStatus() {
      fetch('/api/authUser', { method: 'GET', credentials: 'include' })
        .then(response => response.json())
        .then(data => {
          if (data.message === "已登入") {
            loginButton.style.display = "none";
            logoutButton.style.display = "block";
            loginButtonMainPage.style.display = "none";
            logoutButtonMainPage.style.display = "flex";
            console.log("用戶資料:", data.userData);
          } else {
            loginButton.style.display = "block";
            logoutButton.style.display = "none";
            loginButtonMainPage.style.display = "flex";
            logoutButtonMainPage.style.display = "none";
            console.log("用戶未登入");
          }
        })
        .catch(error => console.error('Error fetching authUser:', error));
    }

    function logout() {
      fetch('/api/logout', { method: 'POST', credentials: 'include' })
        .then(response => response.json())
        .then(result => {
          if (result.message === "登出成功") {
            window.location.reload();
          }
        })
        .catch(error => console.error('登出失敗:', error));
    }
  });
</script>
